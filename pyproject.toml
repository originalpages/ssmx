[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ssmx"
version = "0.2.1"
description = "A smarter AWS SSM CLI: connect, run and port-forward to EC2, RDS, Aurora and ElastiCache by name."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["boto3>=1.26"]
keywords = ["aws", "ssm", "session-manager", "rds", "port-forwarding", "cli"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ssmx = "ssmx:main"

[tool.setuptools]
py-modules = ["ssmx"]
